<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Colorslide</title>
  <meta name="theme-color" content="#0d0f1f">
  <meta name="description" content="A hex stack sorting puzzle that works offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="title">
        <h1>Color<span>slide</span></h1>
        <div id="version"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label" id="scoreLabel">Score</div><div class="value" id="score">0</div></div>
        <div class="stat clickable" id="bestStat" role="button" tabindex="0" title="Clear high score"><div class="label">Best</div><div class="value" id="best">0</div></div>
      </div>
      <button id="autoBtn" class="btn" aria-pressed="false">Auto</button>
      <button id="tiltBtn" class="btn" aria-pressed="false" title="Straighten the board while dragging">Tilt</button>
      <button id="newGame" class="btn">New Game</button>
    </header>
    <main id="stage">
      <canvas id="board"></canvas>
      <div id="modeOverlay" class="overlay hidden">
        <div class="card">
          <div id="intro" class="hidden">
            <h2>Colorslide</h2>
            <p>Drag a stack of hexes onto the board. Neighbouring stacks with the same top color slide together. Collect <b>10</b> of one color to clear them and score.</p>
          </div>
          <div id="overInfo" class="hidden">
            <h2 id="overTitle">Board full!</h2>
            <p id="finalLabel">Final score</p>
            <div class="final"><s id="oldBest"></s><span id="finalScore">0</span></div>
          </div>
          <div class="modes">
            <button id="classicBtn" class="btn big mode">Classic</button>
            <button id="obstaclesBtn" class="btn big mode">Random</button>
            <button id="maxBtn" class="btn big mode">Max</button>
            <button id="puzzle5Btn" class="btn big mode">Puzzle 5</button>
            <button id="puzzle6Btn" class="btn big mode">Puzzle 6</button>
            <button id="puzzle7Btn" class="btn big mode">Puzzle 7</button>
            <button id="dailyBtn" class="btn big mode wide">Daily puzzle</button>
            <button id="againBtn" class="btn big again hidden">Same again</button>
          </div>
          <div class="card-foot">
            <button id="installBtn" class="btn ghost hidden">Install app</button>
          </div>
        </div>
      </div>
      <div id="clearBestOverlay" class="overlay hidden">
        <div class="card">
          <h2>Clear high score?</h2>
          <div class="modes">
            <button id="clearBestYes" class="btn big">Clear</button>
            <button id="clearBestNo" class="btn big mode">Cancel</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="game.js"></script>
  <script>
    // Offline support + install prompt (only works over http/https, not file://).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      // Show the version from the active cache name (colorslide-vNN in sw.js).
      navigator.serviceWorker.ready.then(() => caches.keys()).then((keys) => {
        const k = keys.find((k) => k.startsWith('colorslide-'));
        if (k) document.getElementById('version').textContent = k.slice('colorslide-'.length);
      }).catch(() => {});
    }
    let installEvent = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installEvent = e;
      installBtn.classList.remove('hidden');
    });
    installBtn.addEventListener('click', async () => {
      if (!installEvent) return;
      installEvent.prompt();
      await installEvent.userChoice;
      installEvent = null;
      installBtn.classList.add('hidden');
    });
    window.addEventListener('appinstalled', () => installBtn.classList.add('hidden'));
  </script>
</body>
</html>
