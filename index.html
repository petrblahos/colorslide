<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Colorslide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Color<span>slide</span></h1>
      <div class="stats">
        <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      </div>
      <button id="newGame" class="btn">New Game</button>
    </header>
    <main id="stage">
      <canvas id="board"></canvas>
      <div id="startOverlay" class="overlay">
        <div class="card">
          <h2>Colorslide</h2>
          <p>Drag a stack of hexes onto the board. Neighbouring stacks with the same top color slide together. Collect <b>10</b> of one color to clear them and score.</p>
          <button id="startBtn" class="btn big">Start game</button>
        </div>
      </div>
      <div id="overOverlay" class="overlay hidden">
        <div class="card">
          <h2>Board full!</h2>
          <p>Final score</p>
          <div class="final" id="finalScore">0</div>
          <button id="againBtn" class="btn big">Play again</button>
        </div>
      </div>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
